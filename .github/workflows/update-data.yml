# Refresh data/*.json from USDA APIs on a schedule (or manually).
# After push, GitHub Pages or your host serves the new static JSON.

name: Update USDA data

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 12:00 AM America/New_York in standard time (EST) → 05:00 UTC.
    # During EDT, same UTC time is 1:00 AM Eastern (GitHub cron is UTC-only).
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh all datasets
        # If USDA_MARS_API_KEY secret is unset, GitHub injects ""; scripts fall back to default key.
        env:
          USDA_MARS_API_KEY: ${{ secrets.USDA_MARS_API_KEY }}
        run: python update_data.py

      - name: Commit and push if data changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          # Fetch latest remote HEAD and build our commit on top of it.
          # Using reset --soft avoids rebase conflicts on the same data/ files.
          git fetch origin main
          git reset --soft origin/main
          git commit -m "chore: refresh USDA data [skip ci]"
          git push origin HEAD:main
