name: Update weekly Turkey data

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch recent USDA data and update both Turkey datasets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python update_turkey_weekly.py

      - name: Commit Breast JSON updates
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turkey_hen_weekly.json public/data/turkey_hen_weekly.json
          if git diff --staged --quiet; then
            echo "No Breast JSON changes."
            exit 0
          fi
          git commit -m "chore: update weekly Turkey Breast data [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
