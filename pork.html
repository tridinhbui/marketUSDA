<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDA Pork Cutout Daily Prices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    #loadBtn   { background: #b91c1c; color: #fff; }
    #exportBtn { background: #1a9e6b; color: #fff; }

    .metric.carcass { color: #b91c1c; }
    .metric.loin    { color: #d97706; }
    .metric.belly   { color: #7c3aed; }
    .metric.days    { color: #1d6fca; }

    .nav-link {
      display: inline-block;
      margin-bottom: 4px;
      margin-right: 12px;
      font-size: .82rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover { text-decoration: underline; }

    .filter-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .filter-row label {
      font-size: .82rem;
      color: var(--muted);
      font-weight: 500;
    }
    select {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: .88rem;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <a class="nav-link" href="index.html">← Hog Prices</a>
        <a class="nav-link" href="turkey.html">← Turkey Prices</a>
      </div>
      <p class="eyebrow">USDA MPR Datamart · LM_PK602</p>
      <h1>Daily Pork Cutout &amp; Primal Prices</h1>
      <p class="sub">National · Negotiated Sales · $/cwt</p>
    </header>

    <section class="panel controls">
      <div class="field">
        <label for="startDate">Start date</label>
        <input id="startDate" type="date" value="2023-01-01" />
      </div>
      <div class="field">
        <label for="endDate">End date</label>
        <input id="endDate" type="date" />
      </div>
      <button id="loadBtn" type="button">Load Prices</button>
      <button id="exportBtn" type="button" disabled>Export Excel</button>
      <p id="status" class="status">Initializing…</p>
    </section>

    <!-- cut selector -->
    <section class="panel" style="padding:12px 20px;">
      <div class="filter-row">
        <label for="cutFilter">Show cuts:</label>
        <select id="cutFilter">
          <option value="all">All Primals</option>
          <option value="pork_carcass">Carcass only</option>
          <option value="pork_loin">Loin only</option>
          <option value="pork_butt">Butt only</option>
          <option value="pork_picnic">Picnic only</option>
          <option value="pork_rib">Rib only</option>
          <option value="pork_ham">Ham only</option>
          <option value="pork_belly">Belly only</option>
        </select>
      </div>
    </section>

    <section class="panel metrics">
      <article>
        <h2>Carcass ($/cwt)</h2>
        <p id="latestCarcass" class="metric carcass">-</p>
      </article>
      <article>
        <h2>Loin ($/cwt)</h2>
        <p id="latestLoin" class="metric loin">-</p>
      </article>
      <article>
        <h2>Belly ($/cwt)</h2>
        <p id="latestBelly" class="metric belly">-</p>
      </article>
      <article>
        <h2>Total Days</h2>
        <p id="totalDays" class="metric days">0</p>
      </article>
    </section>

    <section class="panel chart-wrap">
      <h2>Price Trend</h2>
      <div class="legend" id="chartLegend"></div>
      <canvas id="priceChart" width="1200" height="420" aria-label="Daily pork cutout price trend"></canvas>
    </section>

    <section class="panel table-wrap">
      <h2>Daily Data</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Carcass</th>
              <th>Loin</th>
              <th>Butt</th>
              <th>Picnic</th>
              <th>Rib</th>
              <th>Ham</th>
              <th>Belly</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="pork_app.js"></script>
</body>
</html>
